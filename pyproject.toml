[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-scanner"
version = "1.0.0"
description = "A professional-grade TCP port scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mahmoud Elrefaie", email = "Elrefaiem652@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
port-scanner = "port_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
